# SCOPF flow evaluation: no switching and no initialization solve.
# Overrides for the TopologyOptimizer revision pinned in reproduction/dependencies.json.
# Use input indices 1 through 100 as seeds, shared across the five methods.
# MAX_ANG_OFF retains the recorded value and is inactive while SET_MAX_ANGLE_CLOSE=false.
APPLICATION = "DC_SCOTS_TIME_SLACK_BENDERS"

[SOLVER]
SOLVING_TIME_LIMIT = 10800
INCLUDE_WARMSTART_TIME_LIMIT = false

[SOLVER.MULTITHREADING]
N_THREADS_BENDERS = 1
N_THREADS_MIP_MP = 1
N_THREADS_MIP_SP = 1

[TECHNICAL]
SEED = 1

[LOSS_ESTIMATION]
ESTIMATE_LOSSES = false

[POSTPROCESSING.AC_FEAS]
CHECK = false

[WARMSTARTING]
ENABLED = false
WARMSTART_METHOD = ":scopf"
SCOPF_TIME_LIMIT = 10800

[HEURISTIC_SOLVING]
ENABLED = false

[SUBSTATION_RECONF]
BRANCH_RECONF = false
COUPLER_RECONF = false

[LIMITS.TRANSFORMER]
TRANSFORMER_SHIFTING = false

[LIMITS.GENERATOR]
GEN_SWITCHING = false

[LIMITS.BRANCH]
BRANCH_SWITCHING = true
TAL_TIMESTEP = 0

[PRINTING.SOLVER]
LOG_TO_CONSOLE = true
LOG_TO_CONSOLE_MP = true
LOG_TO_CONSOLE_IP = false
LOG_TO_CONSOLE_SP = false

[BENDERS]
FIX_FORCED_ON_BRANCHES = false

[BENDERS.PARTIAL_DECOMP]
ENABLED = true
INCLUDE_BASE_PF = true
N_MAX_CONTINGENCIES = 0
N_MAX_CONTINGENCIES_PCT = 0.0

[BENDERS.PARTIAL]
ENABLED = true
SORTING_MODE = ":RND"
SCORE_DECAY = 1.0
ETA_ROBUSTNESS = 10.0
ETA_ROBUSTNESS_FEAS = 1.0
STAB_ROUND_FREQ = "Inf"

[BENDERS.PARTIAL.LIMITS]
STOP_AFTER_TIME = "Inf"
STOP_AFTER_N_HITS = "Inf"
STOP_AFTER_N_HITS_REL = 0.05
STOP_AFTER_N_MISSES = "Inf"
STOP_AFTER_N_FEAS_CUTS = "Inf"
STOP_ON_PB = false
STOP_ON_PB_REL_BUFFER = 0.1
MIN_PRIO = 0.0

[BENDERS.CUTS.SELECTION]
ENABLED = true
METHOD = ":VIOLATION"
FEASCUT_ONLY = false
FEASCUT_INF_VIOL = true
MIN_OPT_CUTS = 1

[BENDERS.CUTS.SELECTION.VIOLATION]
LIMIT_MODE = ":abs_num"
LIMIT_ABS_NUM = 5

[BIG_M_MULT]
SET_MAX_ANGLE_CLOSE = false
MAX_ANG_OFF = 30
